[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vamp-gcp-audit"
version = "1.0"
description = "Google Cloud Platform security auditor for authorized assessments"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "VampSecure Studios", email = "contact@vampsecurestudios.com" }]
keywords = ["security", "pentest", "audit", "cybersecurity", "vampsecure", "gcp", "google-cloud", "cloud", "iam"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.9.0",
    "rich>=13.7.0",
]


[project.scripts]
vamp-gcp-audit = "vamp_gcp_audit:main"

[project.urls]
Homepage = "https://github.com/Vampsecure-Labs/vamp-gcp-audit"
Repository = "https://github.com/Vampsecure-Labs/vamp-gcp-audit"

[tool.setuptools]
py-modules = ["vamp_gcp_audit"]
